# Configurazione dei flag di Pandoc
pdf-engine: typst
# [[link]] e ![[immagine]] di Obsidian
from: markdown+wikilinks_title_after_pipe
to: pdf

# le immagini delle note stanno in studio/assets
resource-path:
  - .
  - studio/assets

include-in-header:
  - studio/.style/style.typ

# Configurazione dei metadati e dello stile (pari al front matter)
metadata:
  papersize: "a4"
  fontsize: 12pt
  margin:
    x: 1.5cm
    y: 2cm
